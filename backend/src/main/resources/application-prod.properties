
# ============================================================
# PRODUCTION PROFILE
# ============================================================

# Hibernate must validate the existing schema.
# Flyway is responsible for schema changes.
spring.jpa.hibernate.ddl-auto=validate

# Disable SQL logging in production.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# ============================================================
# DATABASE MIGRATIONS
# ============================================================

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0
app.cognito.enabled=true

# Production must explicitly provide the bucket and IAM-backed AWS credentials.
app.s3.enabled=${S3_ENABLED:true}
