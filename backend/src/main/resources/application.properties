
spring.application.name=ev-fleet-intelligence

# ==========================================
# DEVELOPMENT / LOCAL DATABASE
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/evfleetdb
spring.datasource.username=postgres
spring.datasource.password=geetesh
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE - DEVELOPMENT
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SERVER
# ==========================================
server.port=8080
server.address=0.0.0.0

# ==========================================
# COGNITO JWT RESOURCE SERVER
# Set these in the process environment or secret manager.
# Never commit real values to source control.
#
# COGNITO_ENABLED=true
# COGNITO_ISSUER_URI=https://cognito-idp.<region>.amazonaws.com/<user-pool-id>
# ==========================================
app.cognito.issuer-uri=${COGNITO_ISSUER_URI:}
app.cognito.enabled=${COGNITO_ENABLED:false}

# ==========================================
# CORS
# Set the exact Flutter web / React origin. No wildcard with credentials.
# Example: FRONTEND_ORIGIN=https://app.evfleet.example.com
# Development default: http://localhost:3000
# ==========================================
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:3000}

# ==========================================
# PRODUCTION - AWS EC2 + RDS
# Uncomment these properties and comment out
# the corresponding development properties
# ==========================================

# spring.datasource.url=jdbc:postgresql://YOUR_RDS_ENDPOINT:5432/evfleetdb
# spring.datasource.username=YOUR_RDS_USERNAME
# spring.datasource.password=${DB_PASSWORD}
# spring.jpa.hibernate.ddl-auto=validate
# spring.jpa.show-sql=false
# spring.jpa.properties.hibernate.format_sql=false
# server.port=8080
