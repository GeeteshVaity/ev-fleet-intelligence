spring.application.name=ev-fleet-intelligence

# Local defaults; production overrides these with environment variables.
# NEVER commit a database password: supply DB_PASSWORD (or the standard
# SPRING_DATASOURCE_PASSWORD override) in the environment instead.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/evfleetdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Flyway owns schema changes. Baseline an existing schema instead of failing
# startup when the history table is missing (for example a database first
# created by ddl-auto=update).
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0

server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

app.cognito.issuer-uri=${COGNITO_ISSUER_URI:}
app.cognito.enabled=${COGNITO_ENABLED:false}
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:3000}
