
# ============================================================
# APPLICATION
# ============================================================

spring.application.name=ev-fleet-intelligence


# ============================================================
# DATABASE - POSTGRESQL
# ============================================================

# Local development defaults.
# Production values should be supplied through environment variables.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/evfleetdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Development default: update schema automatically.
# Production overrides this with validate.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# SQL logging
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}


# ============================================================
# DATABASE MIGRATIONS - FLYWAY
# ============================================================

# Flyway manages database schema migrations.
spring.flyway.enabled=${FLYWAY_ENABLED:true}

# Baseline an existing database when Flyway history is absent.
# Review existing database tables and migration scripts before production use.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=0


# ============================================================
# SERVER
# ============================================================

server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s


# ============================================================
# SECURITY - AWS COGNITO
# ============================================================

# Keep disabled by default for local development.
# Set COGNITO_ENABLED=true in production.
app.cognito.enabled=${COGNITO_ENABLED:false}

# Cognito User Pool issuer URL
app.cognito.issuer-uri=${COGNITO_ISSUER_URI:}

# Cognito App Client ID (public identifier; not a client secret)
app.cognito.client-id=${COGNITO_CLIENT_ID:}

# ============================================================
# AWS S3 - STATION IMAGES
# ============================================================

# Disabled until a private bucket and IAM role are configured.
app.s3.enabled=${S3_ENABLED:false}
app.s3.bucket=${S3_BUCKET:}
app.s3.region=${AWS_REGION:ap-south-1}
app.s3.presign-expiry-seconds=${S3_PRESIGN_EXPIRY_SECONDS:900}


# ============================================================
# CORS - FRONTEND
# ============================================================

# Local frontend default.
# Set FRONTEND_ORIGIN to the exact production frontend origin.
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:3000}


# ============================================================
# ACTUATOR - HEALTH MONITORING
# ============================================================

# Expose only the health endpoint over HTTP.
management.endpoints.web.exposure.include=health

# Enable Kubernetes-style liveness and readiness probes.
management.endpoint.health.probes.enabled=true

# Detailed health information is restricted to authorized users.
management.endpoint.health.show-details=when-authorized


# ============================================================
# ERROR HANDLING
# ============================================================

# Do not expose internal exception messages or stack traces.
server.error.include-message=never
server.error.include-stacktrace=never
