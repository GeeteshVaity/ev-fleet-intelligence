
spring.application.name=ev-fleet-intelligence

# ==========================================
# DEVELOPMENT / LOCAL DATABASE
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/evfleetdb
spring.datasource.username=postgres
spring.datasource.password=sakec
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE - DEVELOPMENT
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# SERVER
# ==========================================
server.port=8080
server.address=0.0.0.0


# ==========================================
# PRODUCTION - AWS EC2 + RDS
# Uncomment these properties and comment out
# the corresponding development properties
# ==========================================

