spring.datasource.url=jdbc:h2:mem:evfleet;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Cognito security is disabled in tests; standalone MockMvc controls auth.
app.cognito.enabled=false
# Allow any origin in tests so CORS does not interfere with MockMvc assertions.
app.frontend.origin=http://localhost:3000
