name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: evfleetdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d evfleetdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - run: ./mvnw -B verify
        env:
          DB_URL: jdbc:postgresql://localhost:5432/evfleetdb
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DDL_AUTO: validate
          FLYWAY_BASELINE_ON_MIGRATE: false
          COGNITO_ENABLED: false
          S3_ENABLED: false

  charging-provider:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/charging_provider

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  publish-backend:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, charging-provider]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend JAR
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Diagnose GitHub OIDC identity
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            core.info(`OIDC issuer: ${payload.iss}`);
            core.info(`OIDC audience: ${payload.aud}`);
            core.info(`OIDC subject: ${payload.sub}`);
            core.info(`Repository ID: ${payload.repository_id}`);
            core.info(`Owner ID: ${payload.repository_owner_id}`);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Upload JAR to S3
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          set -euo pipefail

          test -n "$S3_BUCKET"

          JAR_PATH="$(find backend/target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n 1)"

          if [ -z "$JAR_PATH" ]; then
            echo "Backend JAR was not found."
            exit 1
          fi

          aws s3 cp "$JAR_PATH" \
            "s3://${S3_BUCKET}/releases/${GITHUB_SHA}/backend.jar"

          echo "Uploaded backend JAR for commit ${GITHUB_SHA}"
