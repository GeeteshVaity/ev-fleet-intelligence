name: Deploy production API

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Git commit SHA whose backend JAR should be deployed"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}

      - name: Validate deployment inputs
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid commit SHA."
            exit 1
          fi

          test -n "$S3_BUCKET"
          test -n "$INSTANCE_ID"

          aws s3api head-object \
            --bucket "$S3_BUCKET" \
            --key "releases/${COMMIT_SHA}/backend.jar"

      - name: Deploy JAR through Systems Manager
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          COMMANDS=$(cat <<EOF
          set -euo pipefail

          echo "Downloading backend JAR..."
          aws s3 cp "s3://${S3_BUCKET}/releases/${COMMIT_SHA}/backend.jar" /tmp/backend.jar

          test -s /tmp/backend.jar

          echo "Installing backend JAR..."
          install -o ec2-user -g ec2-user -m 0640 \
            /tmp/backend.jar \
            /opt/ev-fleet-intelligence/app.jar.new

          mv /opt/ev-fleet-intelligence/app.jar.new \
             /opt/ev-fleet-intelligence/app.jar

          echo "Restarting Spring Boot service..."
          sudo systemctl restart ev-fleet-api.service

          sleep 5

          if ! sudo systemctl is-active --quiet ev-fleet-api.service; then
            sudo systemctl status ev-fleet-api.service --no-pager || true
            sudo journalctl -u ev-fleet-api.service -n 80 --no-pager || true
            exit 1
          fi

          echo "Backend deployment successful."
          sudo systemctl status ev-fleet-api.service --no-pager
          EOF
          )

          PARAMETERS=$(jq -n --arg commands "$COMMANDS" '{commands: [$commands]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json
